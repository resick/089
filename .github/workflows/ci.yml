name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # reads the version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: Build web + bundle mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    env:
      NEXT_PUBLIC_APP_ENV: local
      NEXT_PUBLIC_SITE_URL: http://localhost:3089
      EXPO_PUBLIC_APP_ENV: local
      EXPO_PUBLIC_MAP_STYLE_URL: https://tiles.openfreemap.org/styles/dark
      EXPO_PUBLIC_MAP_STYLE_URL_LIGHT: https://tiles.openfreemap.org/styles/positron
      # Placeholders: the build only needs values that pass validation.
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @089/web build
      # Bundles JS for both platforms with Metro: catches resolution and
      # monorepo errors without needing a native build.
      - run: pnpm --filter @089/mobile export:check

  database:
    name: Database (migrations, RLS tests, types)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Starts only Postgres (Docker), applying every migration and seed.sql
      # from scratch: proves `supabase db reset` reproduces the schema.
      - run: pnpm exec supabase db start
      - run: pnpm exec supabase test db
      # The committed types come from the hosted project, whose PostgREST
      # version differs from the local image's, so that one line is ignored.
      - name: Generated types match the schema
        run: |
          pnpm exec supabase gen types typescript --local --schema public > /tmp/database.types.ts
          if ! diff -u <(grep -v PostgrestVersion packages/db/src/database.types.ts) \
                       <(grep -v PostgrestVersion /tmp/database.types.ts) > /tmp/types.diff; then
            { echo '### Generated types differ from packages/db (run `pnpm db:types` and commit)'
              echo '```diff'; head -c 60000 /tmp/types.diff; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/types.diff
            exit 1
          fi
